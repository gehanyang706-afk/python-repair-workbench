name: Offline validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      swebench_harness:
        description: Run the pinned official evaluator on the synthetic local fixture (no model calls)
        type: boolean
        default: false
permissions:
  contents: read
env:
  DASHSCOPE_API_KEY: ''
  LANGSMITH_TRACING: 'false'
  LANGCHAIN_TRACING_V2: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  swebench-harness:
    if: github.event_name == 'workflow_dispatch' && inputs.swebench_harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install Agent and isolated official evaluator dependencies
        run: |
          python -m pip install -r requirements-agent.lock
          python -m venv runtime/swebench-env
          runtime/swebench-env/bin/python -m pip install -r requirements-swebench.lock
      - name: Build local fixture without pulling a benchmark task image
        run: |
          docker build -f Dockerfile.tests -t repair-workbench-test:ci .
          docker build --build-arg TEST_IMAGE=repair-workbench-test:ci -t repair-swebench-fixture:ci benchmarks/swebench-harness-fixture-v1
      - name: Official negative and positive controls; no inference
        run: python scripts/qualify_swebench_fixture.py --image repair-swebench-fixture:ci --output runtime/swebench-harness-ci --harness-python runtime/swebench-env/bin/python
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Standard-library core and dataset integrity
        run: |
          python -m unittest discover -s tests -p test_snapshot_and_results.py -v
          python -m unittest discover -s tests -p test_candidate.py -v
          python -m unittest discover -s tests -p test_diagnostic_evaluation_plan.py -v
          python -m unittest discover -s tests -p test_diagnostic_evaluation_reports.py -v
          python scripts/check_delivery.py
      - name: Build and inspect wheel
        run: |
          python -m pip install -r requirements-build.lock
          python -m pip wheel --no-deps --no-build-isolation . -w runtime/ci-wheel
          python scripts/check_delivery.py --wheel runtime/ci-wheel/*.whl
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_DOCKER_TESTS: '1'
      REPAIR_TEST_IMAGE: repair-workbench-test:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install fixed workbench dependencies
        run: |
          python -m pip install -r requirements-agent.lock -r requirements-mcp.lock
          python -m pip check
      - name: Build reference test image and record identity
        run: |
          docker build -f Dockerfile.tests -t "$REPAIR_TEST_IMAGE" .
          docker image inspect "$REPAIR_TEST_IMAGE" --format '{{.Id}}'
          docker run --rm --network none "$REPAIR_TEST_IMAGE" python -m pip freeze
      - name: Agent tools, transport, web and complete Docker regression
        run: python -m unittest discover -s tests -v
      - name: Check dataset hashes
        run: python scripts/check_delivery.py
      - name: Qualify delivery cases without model calls
        run: |
          docker build -f benchmarks/delivery-heldout-v1/Dockerfile --build-arg TEST_IMAGE="$REPAIR_TEST_IMAGE" -t repair-workbench-heldout:ci benchmarks/delivery-heldout-v1
          python scripts/qualify_delivery_cases.py --image repair-workbench-heldout:ci --output runtime/ci-heldout-qualification
      - name: Reverify recorded success and miss without model calls
        run: python scripts/replay_recorded_cases.py --image "$REPAIR_TEST_IMAGE" --output runtime/ci-recorded-replay
  mysql-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: repair_workbench_test
          MYSQL_USER: repair
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 33079:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      RUN_MYSQL_TESTS: '1'
      RUN_DOCKER_TESTS: '1'
      REPAIR_TEST_IMAGE: repair-workbench-test:ci
      REPAIR_DB_HOST: 127.0.0.1
      REPAIR_DB_PORT: '33079'
      REPAIR_DB_USER: repair
      REPAIR_DB_PASSWORD: ci-test-only
      REPAIR_DB_NAME: repair_workbench_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed offline dependencies
        run: python -m pip install -r requirements-agent.lock -r requirements-mcp.lock -r requirements-backend.lock
      - name: Build target fixture image
        run: docker build -f Dockerfile.tests -t "$REPAIR_TEST_IMAGE" .
      - name: Real MySQL, worker processes and full offline regression
        run: python -m unittest discover -s tests -v
